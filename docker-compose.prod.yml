# BizYangu — Production Docker Compose (Oracle Cloud Free Tier VM)
#
# Runs: postgres, redis, backend (daphne via Dockerfile.prod), a Celery
# worker, a Celery beat scheduler, and Caddy as a reverse proxy that
# gets HTTPS automatically from Let's Encrypt for your real domain.
# The Next.js frontend is NOT here — that's deploying to Vercel
# separately, since it's a static export.
#
# Usage:
#   cp .env.production.example .env.production   # fill in real values first
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f backend

# Explicit project name, not left to default to the containing directory's
# name. Compose derives container names as <project>-<service>-<n> when
# no container_name: is set (removed below — see rationale there); an
# implicit project name silently changes if this file is ever invoked
# from a differently-named directory or a differently-cased checkout,
# producing a *second* set of containers alongside the first instead of
# replacing them. Pinning it here means every `docker compose ... up`
# against this file — from deploy.yml, from a manual SSH session, from
# a fresh checkout — always resolves to the same project and the same
# container identity, regardless of invocation directory.
name: bizyangu

services:

  # container_name: intentionally not set on any service below (removed
  # 2026-09-22 — was bizyangu_postgres/bizyangu_redis/bizyangu_backend/
  # bizyangu_celery_worker/bizyangu_celery_beat/bizyangu_caddy). A fixed
  # container_name is a *hard* uniqueness constraint Docker enforces
  # regardless of which compose project created the container — if an
  # old/orphaned container still holds that exact name (a prior deploy
  # that didn't get torn down cleanly, a manually-run container, a stale
  # container from an inconsistent project name), `up -d --build` cannot
  # create the new one and fails with "Conflict. The container name
  # ... is already in use." This is the confirmed cause of a real failed
  # deploy. Without container_name, Compose names containers
  # <project>-<service>-<n> (see the top-level `name: bizyangu` above)
  # and can cleanly stop-and-replace its own previous container on every
  # deploy — `--remove-orphans` (see deploy.yml) handles anything Compose
  # itself created but no longer expects; it does not need container_name
  # to identify what's safe to replace.

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.production
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port mapping — only reachable from other containers on this
    # compose network, not from the internet.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./knowledge:/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No host port mapping — Caddy is the only thing that talks to this
    # directly, on the internal compose network.

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./knowledge:/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A bizyangu worker --loglevel=info

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file: .env.production
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./knowledge:/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # This is the process that actually runs the STK-timeout cleanup
    # job every 5 minutes (CELERY_BEAT_SCHEDULE in settings/base.py).
    # Nothing in the old dev docker-compose.yml ran this at all.
    command: celery -A bizyangu beat --loglevel=info

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
